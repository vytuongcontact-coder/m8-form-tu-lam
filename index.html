<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thí nghiệm đọc biểu đồ thương mại</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Bố cục: màn văn bản một cột hẹp; màn câu hỏi chia đôi, hình bên trái, câu hỏi và nút trả lời bên phải. Nền trắng để hình giống bản gốc. */
:root{
  --ink:#1c2430; --muted:#5b6675; --line:#d5dbe3; --paper:#ffffff; --accent:#1f4e79; --accent-soft:#e7eef6;
  --ok:#1b7a43; --warn:#a85f00; --bad:#b3261e;
  --display:"Be Vietnam Pro", "Segoe UI", Arial, sans-serif; --body:"Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.page{max-width:720px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.5rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.2rem;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.rule{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
ul.tight{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
textarea,input[type=text]{font:inherit;font-weight:400;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:12px 18px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{font-size:1.05rem;padding:14px 22px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.opts.three{grid-template-columns:1fr}
.opt,.sc{font:inherit;font-size:.86rem;padding:6px 4px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;text-align:center;line-height:1.25}
.opt[aria-pressed="true"],.sc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.grp{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 0 8px 12px;border-left:4px solid var(--warn);font-size:.95rem}
.msg.ok{border-left-color:var(--ok)} .msg.err{border-left-color:var(--bad)}
.bar{display:flex;gap:4px} .bar span{flex:1;height:5px;border-radius:3px;background:var(--line)} .bar span.d{background:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
/* màn câu hỏi */
#test{display:none;height:100%;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);gap:0}
#test.on{display:grid}
#stagehead{grid-column:1;grid-row:1;padding:10px 16px 0}
#stagehead .t{font-weight:700;font-size:.98rem;line-height:1.3}
#stagehead .s{font-size:.8rem;color:var(--muted);line-height:1.3}
#stage{grid-column:1;grid-row:2;position:relative;min-height:0}
#chart{position:absolute;inset:0}
#side{grid-column:2;grid-row:1 / span 2;border-left:1px solid var(--line);padding:12px 16px 0;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
#side .confirm{position:sticky;bottom:0;background:var(--paper);padding:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.q{font-size:1.12rem;font-weight:700;line-height:1.35;text-wrap:balance}
.tag{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

async function showChart(version){
  const f = FIGS[FIG_OF[version]];
  $("ct").textContent = f.title; $("cs").textContent = f.subtitle;
  $("test").classList.add("on"); $("text").hidden = true;
  const box = $("stage").getBoundingClientRect();
  const data = JSON.parse(JSON.stringify(f.data)), layout = JSON.parse(JSON.stringify(f.layout));
  layout.title = {text:""}; layout.autosize = false;
  if (version === "3D"){ layout.width = Math.floor(box.width); layout.height = Math.floor(box.height); layout.margin = {l:10,r:10,t:10,b:36}; }
  else { layout.height = Math.floor(box.height); layout.width = Math.floor(Math.min(box.width, box.height * 1.45)); layout.margin = {l:150,r:20,t:140,b:36}; }
  counting = false;
  if (!plotted){ await Plotly.newPlot("chart", data, layout, CONFIG); plotted = true;
    const gd = $("chart");
    gd.on("plotly_hover", () => { if (counting) counters.hover++; });
    gd.on("plotly_relayout", () => { if (counting) counters.view++; });
  } else { await Plotly.react("chart", data, layout, CONFIG); }
  $("chart").style.visibility = "visible";
}

let timers = [];
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
async function questionScreen(st, practice){
  const Q = practice ? PRACTICE[st.r] : QUESTIONS[st.qi];
  const groups = practice ? GROUPS : Q.groups;
  const side = $("side"); side.textContent = "";
  let choice = "";
  const confirm = el("button",{class:"btn big", text:"Xác nhận", disabled:true});
  const optsWrap = el("div",{class:"stack"});
  for (const [g, names] of groups){
    if (g) optsWrap.append(el("div",{class:"grp", text:g}));
    const box = el("div",{class: names.length <= 3 ? "opts three" : "opts"});
    for (const n of names){
      const b = el("button",{class:"opt", type:"button", "aria-pressed":"false", text:n});
      b.addEventListener("click", () => { choice = n; for (const x of side.querySelectorAll(".opt")) x.setAttribute("aria-pressed", String(x === b)); confirm.disabled = false; });
      box.append(b);
    }
    optsWrap.append(box);
  }
  const unk = el("button",{class:"opt", type:"button", "aria-pressed":"false", text:"Không tìm được đáp án"});
  unk.addEventListener("click", () => { choice = "Không biết"; for (const x of side.querySelectorAll(".opt")) x.setAttribute("aria-pressed", String(x === unk)); confirm.disabled = false; });
  const note = el("p",{class:"small muted", id:"tnote"});
  side.append(...[
    el("div",{class:"top"}, el("span",{class:"tag", text: practice ? `Câu tập · Hình ${st.r}/2` : `Hình ${st.r}/2 · Câu ${st.qi+1}/3`}), stopLink()),
    el("p",{class:"q", text:Q.q}),
    practice ? el("p",{class:"small muted", text: st.v === "3D" ? "Thử di chuột vào chấm nhỏ gần nước mua; kéo để xoay." : "Thử di chuột vào một ô để xem câu đầy đủ."}) : null,
    optsWrap, el("div",{class:"confirm"}, unk, confirm, note)].filter(Boolean));
  hideChart();
  await showChart(st.v);
  counters = {hover:0, view:0, left:0}; counting = true;
  const t0 = performance.now();
  clearTimers();
  if (!practice){
    timers.push(setTimeout(() => { note.textContent = "Còn khoảng 30 giây."; }, (TIMEOUT-30)*1000));
    timers.push(setTimeout(() => finish("hết giờ", TIMEOUT), TIMEOUT*1000));
  }
  let done = false;
  function finish(ans, secs){
    if (done) return; done = true; counting = false; clearTimers();
    const c = {...counters};
    if (practice){ practiceFeedback(st, Q, ans); return; }
    const mapped = Q.map ? (Q.map[ans] || ans) : ans;
    S.cur = {round:st.r, version:st.v, question:Q.id, answer:mapped, correct: mapped === Q.a ? 1 : 0,
             seconds: Math.round(secs*10)/10, hover_count:c.hover, view_changes:c.view, left_page:c.left, t_shown:new Date(Date.now() - secs*1000).toISOString()};
    next();
  }
  confirm.addEventListener("click", () => finish(choice, Math.min(TIMEOUT, (performance.now() - t0)/1000)));
}
function practiceFeedback(st, Q, ans){
  const side = $("side"); side.textContent = "";

  side.append(el("p",{class:"q", text:Q.q}),
    el("p",{class: ok ? "msg ok" : "msg", text: ok ? `Đúng. ${Q.ev}` : `Đáp án là ${Q.a}. ${Q.ev}`}),
    el("p",{class:"small", text: st.v === "3D" ? "Bạn có thể tiếp tục di chuột, xoay, phóng to để làm quen. Khi sẵn sàng, bấm Bắt đầu câu hỏi chính." : "Bạn có thể tiếp tục di chuột lên các ô để làm quen. Khi sẵn sàng, bấm Bắt đầu câu hỏi chính."}),

  const nodes = [el("h1",{text:"Cảm ơn bạn đã tham gia"}),
    el("p",{text:`Mã của bạn: ${S.participant}.`}),
    el("p",{text:"Xin đừng kể câu hỏi hay đáp án cho người khác, vì nhóm còn mời thêm người làm thí nghiệm."})];
  if (!S.saved){
    const csv = toCsv(S.finalRows || []);
    const ta = el("textarea",{readonly:true, style:"min-height:140px;font-family:monospace;font-size:.75rem", "aria-label":"Kết quả dạng CSV"}); ta.value = csv;
    const m = el("p",{class:"small muted"});
    const copy = el("button",{class:"btn ghost", text:"Sao chép kết quả", onclick: async () => {
      try { await navigator.clipboard.writeText(csv); m.textContent = "Đã sao chép."; } catch(e){ m.textContent = "Hãy chọn toàn bộ ô bên dưới và sao chép."; } }});
    nodes.push(el("div",{class:"rule"},
      el("p",{class:"msg err", text: S.saveError || "Bản xem thử không lưu kết quả."}),
      el("p",{class:"small", text: ONLINE ? "Hãy sao chép kết quả dưới đây và gửi lại cho người đã gửi đường link cho bạn." : "Dữ liệu của lượt thử:"}),
      copy, m, ta));
  }
  textScreen(...nodes);
}

/* ============ Điều phối ============ */
function render(){
  if (S.step < 0) return;
  if (!S.participant){ if (!S.screen) return screenCheck(); return screenConsent(); }
  const st = PLAN[S.step];
  if (st === undefined) return screenDone();
  if (st === "howto") return screenHowto();
  if (st === "final") return screenFinal();
  if (st.t === "intro") return screenIntro(st);
  if (st.t === "practice") return questionScreen(st, true);
  if (st.t === "ready") return screenReady(st);
  if (st.t === "q") return questionScreen(st, false);
  if (st.t === "post") return screenPost(st);
}
window.addEventListener("beforeunload", e => { if (S.participant && S.step >= 0 && PLAN[S.step] !== undefined){ e.preventDefault(); e.returnValue = ""; } });
render();
</script>
